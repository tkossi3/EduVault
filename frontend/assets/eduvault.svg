<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="ev-grad-primary" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="ev-grad-accent" x1="16" y1="16" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="ev-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E3A8A" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Base arrondie -->
  <rect width="48" height="48" rx="13" fill="url(#ev-grad-primary)" />
  
  <!-- Silhouette du coffre & voûte académique -->
  <path d="M12 16C12 13.7909 13.7909 12 16 12H32C34.2091 12 36 13.7909 36 16V33C36 34.6569 34.6569 36 33 36H15C13.3431 36 12 34.6569 12 33V16Z" fill="#FFFFFF" fill-opacity="0.12" />
  
  <!-- Pages ouvertes d'un livre formant un coffre -->
