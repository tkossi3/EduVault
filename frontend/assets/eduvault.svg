  <path d="M24 15V28" stroke="#1E3A8A" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Sceau central émeraude de sécurité / savoir -->
  <circle cx="24" cy="21.5" r="4" fill="url(#ev-grad-accent)" filter="url(#ev-glow)" />
  <path d="M22.5 21.5L23.5 22.5L25.5 20.5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Étoile d'excellence académique -->
